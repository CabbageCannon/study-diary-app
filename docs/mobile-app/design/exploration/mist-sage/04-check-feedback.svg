<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="2532" viewBox="0 0 1170 2532" role="img" aria-label="雾绿延续 · 04-check-feedback">
  <defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .035"/></feComponentTransfer></filter></defs>
  <rect width="1170" height="2532" fill="#EEF3EE"/><rect width="1170" height="2532" filter="url(#grain)" opacity=".8"/>
  <text x="72" y="179" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="42" font-weight="400" fill="#1D2821" text-anchor="start" >‹</text><text x="137" y="171" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="500" fill="#617066" text-anchor="start" >算法 · 两数之和</text><path d="M 72 219 L 1098 219" stroke="#C9D4CC" stroke-width="2" opacity="1"/><text x="72" y="316" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" fill="#617066" text-anchor="start" >这次核对</text><text x="72" y="405" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="56" font-weight="670" fill="#35664D" text-anchor="start" >方向成立。</text><text x="72" y="468" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="400" fill="#1D2821" text-anchor="start" >再说明一步，思路就完整了。</text>
  <rect x="72" y="565" width="1026" height="282" rx="27" fill="#DCEBE0" stroke="none" stroke-width="0"/><text x="114" y="639" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="650" fill="#35664D" text-anchor="start" >你已说对</text><text x="114" y="707" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="31" font-weight="400" fill="#1D2821" text-anchor="start" >用哈希表记录已出现的数，</text><text x="114" y="758" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="31" font-weight="400" fill="#1D2821" text-anchor="start" >把查找从 O(n) 降到 O(1)。</text>
  <text x="72" y="964" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="650" fill="#1D2821" text-anchor="start" >最值得补充</text><path d="M 72 996 L 1098 996" stroke="#C9D4CC" stroke-width="2" opacity="1"/><text x="72" y="1080" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="34" font-weight="550" fill="#1D2821" text-anchor="start" >先查补数，再存当前值。</text><text x="72" y="1134" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="400" fill="#617066" text-anchor="start" >这样不会把同一个位置用两次。</text><path d="M 72 1201 L 1098 1201" stroke="#C9D4CC" stroke-width="2" opacity="1"/><text x="72" y="1281" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="34" font-weight="520" fill="#1D2821" text-anchor="start" >复杂度：时间 O(n) · 空间 O(n)</text>
  <rect x="72" y="1427" width="1026" height="116" rx="26" fill="#35664D" stroke="#35664D" stroke-width="0"/><text x="585" y="1501" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="33" font-weight="650" fill="#FFFFFF" text-anchor="middle" >补充后再核对</text><rect x="72" y="1567" width="1026" height="116" rx="26" fill="#FBFDFC" stroke="#C9D4CC" stroke-width="2"/><text x="585" y="1641" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="33" font-weight="650" fill="#35664D" text-anchor="middle" >下一题</text><text x="585" y="1771" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" fill="#35664D" text-anchor="middle" >查看完整参考思路</text></svg>