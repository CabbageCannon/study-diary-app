<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="2532" viewBox="0 0 390 844" role="img" aria-label="雾绿延续 · 02-interview-answer" data-design-canvas="390x844 CSS px" data-export-scale="3x"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .03"/></feComponentTransfer></filter></defs><rect width="390" height="844" fill="#EEF3EE"/><rect width="390" height="844" filter="url(#grain)" opacity=".8"/><text x="20" y="52" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#1D2821" text-anchor="start">‹</text><text x="39" y="49" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="600" fill="#617066" text-anchor="start">八股 · 1 / 3</text><path d="M 20 68 L 370 68" stroke="#C9D4CC" stroke-width="1"/><text x="20" y="101" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="600" fill="#35664D" text-anchor="start">Redis</text><text x="20" y="137" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="600" fill="#1D2821" text-anchor="start">什么是缓存穿透？</text><text x="20" y="164" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#617066" text-anchor="start">请先用自己的话讲一遍。</text><rect x="20" y="188" width="350" height="201" rx="14" fill="#FBFDFC" stroke="#C9D4CC" stroke-width="1"/><text x="36" y="213" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="600" fill="#617066" text-anchor="start">我的回答</text><text x="36" y="251" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1D2821" text-anchor="start">请求的数据既不在缓存，也不在数据库，</text><text x="36" y="279" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1D2821" text-anchor="start">每次都会穿过缓存直接查库。</text><text x="36" y="363" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#617066" text-anchor="start">可用键盘语音输入</text><text x="20" y="429" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#617066" text-anchor="start">先回忆，再看参考。</text><rect x="20" y="453" width="350" height="52" rx="14" fill="#35664D" stroke="none" stroke-width="0"/><text x="195" y="486" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">核对回答</text><text x="195" y="538" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="600" fill="#35664D" text-anchor="middle">参考答案  ·  提示</text></svg>