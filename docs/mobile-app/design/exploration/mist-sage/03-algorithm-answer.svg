<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="2532" viewBox="0 0 390 844" role="img" aria-label="雾绿延续 · 03-algorithm-answer" data-design-canvas="390x844 CSS px" data-export-scale="3x"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .03"/></feComponentTransfer></filter></defs><rect width="390" height="844" fill="#EEF3EE"/><rect width="390" height="844" filter="url(#grain)" opacity=".8"/><text x="20" y="52" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#1D2821" text-anchor="start">‹</text><text x="39" y="49" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="600" fill="#617066" text-anchor="start">算法 · 两数之和</text><path d="M 20 68 L 370 68" stroke="#C9D4CC" stroke-width="1"/><text x="20" y="101" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="600" fill="#35664D" text-anchor="start">数组 / 哈希</text><text x="20" y="137" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="600" fill="#1D2821" text-anchor="start">两数之和</text><text x="20" y="164" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#617066" text-anchor="start">在数组中找到和为目标值的两个位置。</text><rect x="20" y="188" width="350" height="92" rx="12" fill="#E3ECE5" stroke="none" stroke-width="0"/><text x="36" y="212" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="600" fill="#617066" text-anchor="start">示例</text><text x="36" y="240" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1D2821" text-anchor="start">nums = [2, 7, 11, 15]，target = 9</text><text x="36" y="266" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1D2821" text-anchor="start">返回 [0, 1]</text><text x="20" y="316" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="600" fill="#1D2821" text-anchor="start">讲讲你的思路</text><rect x="20" y="332" width="350" height="171" rx="14" fill="#FBFDFC" stroke="#C9D4CC" stroke-width="1"/><text x="36" y="364" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1D2821" text-anchor="start">遍历数组，用哈希表存已经见过的数。</text><text x="36" y="392" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1D2821" text-anchor="start">每次看 target - 当前数是否已经出现。</text><text x="36" y="479" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#617066" text-anchor="start">可选：复杂度、边界条件、代码</text><rect x="20" y="527" width="350" height="52" rx="14" fill="#35664D" stroke="none" stroke-width="0"/><text x="195" y="560" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">帮我核对</text><text x="195" y="613" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="600" fill="#35664D" text-anchor="middle">提示  ·  暂存草稿</text></svg>